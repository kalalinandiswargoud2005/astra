spring:
  application:
    name: astra-backend
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Kolkata
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://aws-1-ap-northeast-2.pooler.supabase.com:6543/postgres?prepareThreshold=0&stringtype=unspecified}
    username: ${SPRING_DATASOURCE_USERNAME:postgres.brubyjknecmleyrlnhbd}
    password: ${SPRING_DATASOURCE_PASSWORD:SU7198UD5BJyJtJ4}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}
      minimum-idle: ${HIKARI_MIN_IDLE:2}
      idle-timeout: 30000
      max-lifetime: 600000
      connection-timeout: 30000
  flyway:
    baseline-on-migrate: true
    baseline-version: '2'
    validate-on-migrate: false
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:supersecretkeythatisverylongandsecureenoughforHS512algorithm1234567890}
  expiration: 86400000 # 24 hours
  refresh-expiration: 604800000 # 7 days

gemini:
  api:
    key: ${GEMINI_API_KEY:}